name: iot-lambda

# Практическая №2, вариант 2 — «Поток событий без потерь» (Lambda-архитектура).
# Запуск:            docker compose up -d --build
# Суточный batch:    docker compose run --rm spark-batch
# Остановить всё:    docker compose down -v

x-spark-env: &spark-env
  KAFKA_BOOTSTRAP: kafka:9092
  KAFKA_TOPIC: iot.events
  PG_HOST: postgres
  PG_USER: de
  PG_PASSWORD: de_pass
  S3_ENDPOINT: http://minio:9000
  AWS_ACCESS_KEY_ID: minio
  AWS_SECRET_ACCESS_KEY: minio12345
  AWS_REGION: us-east-1
  WATERMARK: "2 minutes"
  LOOKBACK_DAYS: "2"

services:
  # ---------- транспорт ----------
  kafka:
    image: apache/kafka:3.8.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_RETENTION_HOURS: 168
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  kafka-init:
    image: apache/kafka:3.8.0
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092
        --create --if-not-exists --topic iot.events --partitions 3 --replication-factor 1

  # ---------- хранение ----------
  # Официальные образы minio/minio убраны с Docker Hub и quay.io, поэтому берём
  # сборку того же MinIO от Chainguard. В ней нет shell и mc, так что healthcheck
  # не делаем, а бакет `lake` создаёт Spark-задача при старте (common.ensure_bucket).
  minio:
    image: cgr.dev/chainguard/minio:latest
    user: root        # том /data создаётся от root
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio12345
    ports:
      - "9001:9001"   # веб-консоль MinIO
    volumes:
      - minio-data:/data

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: de
      POSTGRES_PASSWORD: de_pass
      POSTGRES_DB: serving
    ports:
      - "5433:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U de -d serving"]
      interval: 5s
      timeout: 5s
      retries: 12

  # ---------- источник ----------
  generator:
    build: ./generator
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      KAFKA_TOPIC: iot.events
      PG_DSN: host=postgres dbname=serving user=de password=de_pass
      RATE: "20"          # событий в секунду
      SENSORS: "20"
      P_DUP: "0.05"       # доля дублей
      P_DELAYED: "0.15"   # опоздание 5–90 с (внутри watermark)
      P_VERY_LATE: "0.02" # опоздание 5–30 мин (за пределами watermark)
    stop_grace_period: 20s

  # ---------- обработка ----------
  spark-stream:
    build: ./spark
    image: iot-lambda-spark:latest
    user: root
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      minio:
        condition: service_started
      postgres:
        condition: service_healthy
    environment: *spark-env
    command: >
      /opt/spark/bin/spark-submit --master local[2] --driver-memory 1g
      --conf spark.ui.port=4040 /app/stream_job.py
    ports:
      - "4040:4040"   # Spark UI
    volumes:
      - ./spark/app:/app:ro
      - checkpoints:/checkpoints
    restart: unless-stopped

  spark-batch:
    build: ./spark
    image: iot-lambda-spark:latest
    user: root
    profiles: ["batch"]   # не стартует сам: запускается по расписанию / вручную
    depends_on:
      minio:
        condition: service_started
      postgres:
        condition: service_healthy
    environment: *spark-env
    command: >
      /opt/spark/bin/spark-submit --master local[2] --driver-memory 1g
      --conf spark.ui.enabled=false /app/batch_job.py
    volumes:
      - ./spark/app:/app:ro

  # ---------- потребитель ----------
  grafana:
    image: grafana/grafana:11.2.2
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/iot.json
    ports:
      - "3001:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro

volumes:
  kafka-data:
  minio-data:
  pg-data:
  checkpoints:
